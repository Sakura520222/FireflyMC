plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Explicit local adapter validation. Optional JARs stay external and are never bundled or published.
def ai4TestModProfile = providers.gradleProperty('ai4TestMods').orElse('').get()
def ai4AdditionalProfiles = [
    trees: ['【动态的树／有活力的树】dynamictrees-neoforge-1.21.1-1.7.2.jar', '【动态的树：拓展】DynamicTreesPlus-neoforge-1.21.1-1.3.2.jar'],
    slabs: ['【更好地破坏半砖】kleeslabs-neoforge-1.21.1-21.1.11.jar', 'balm-neoforge-1.21.1-21.0.63.jar'],
    interaction: ['【连锁破坏】ftb-ultimine-neoforge-2101.1.15.jar', '【双开门】doubledoors-1.21.1-7.2.jar', 'collective-1.21.1-8.39.jar',
                  'architectury-13.0.8-neoforge.jar', 'ftb-library-neoforge-2101.1.33.jar'],
    backpacks: ['【精妙背包】sophisticatedbackpacks-1.21.1-3.25.71.1997.jar', '【精妙核心】sophisticatedcore-1.21.1-1.4.77.2173.jar'],
    curios: ['curios-neoforge-9.5.1+1.21.1.jar'],
    equipment: ['【精妙背包】sophisticatedbackpacks-1.21.1-3.25.71.1997.jar', '【精妙核心】sophisticatedcore-1.21.1-1.4.77.2173.jar',
                'curios-neoforge-9.5.1+1.21.1.jar', 'owo-lib-neoforge-0.12.15.6-beta.1+1.21.jar'],
    apoth: ['【神化】Apotheosis-1.21.1-8.6.0.jar', '【神化附魔】ApothicEnchanting-1.21.1-1.6.0.jar',
            '【神化刷怪笼】ApothicSpawners-1.21.1-1.4.0.jar', 'ApothicAttributes-1.21.1-2.10.0.jar', 'Placebo-1.21.1-9.9.2.jar'],
    psi: ['Psi-1.21.1-108.jar', '【帕秋莉手册】Patchouli-1.21.1-93-NEOFORGE.jar'],
    aether: ['【天境】aether-1.21.1-1.5.10-neoforge.jar', 'owo-lib-neoforge-0.12.15.6-beta.1+1.21.jar'],
    deep_aether: ['【天境】aether-1.21.1-1.5.10-neoforge.jar', '【深入天境】deep_aether-1.21.1-1.1.5.1.jar',
                  'aeroblender-1.21.1-1.0.0-neoforge.jar', 'TerraBlender-neoforge-1.21.1-4.1.0.8.jar', 'owo-lib-neoforge-0.12.15.6-beta.1+1.21.jar'],
    twilight: ['【暮色森林】twilightforest-1.21.1-4.8.3345-universal.jar'],
    cataclysm: ["L_Ender's Cataclysm 1.21.1-3.32.jar", 'curios-neoforge-9.5.1+1.21.1.jar', 'lionfishapi-3.1.jar'],
    maid: ['【车万女仆】touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar'],
    irons: ['【Iron的法术与魔法书】irons_spellbooks-1.21.1-3.16.2.jar', 'geckolib-neoforge-1.21.1-4.9.2.jar',
            'player-animation-lib-forge-2.0.4+1.21.1.jar', 'curios-neoforge-9.5.1+1.21.1.jar', 'irons_lib-1.21.1-2.1.0.jar'],
    bumble: ['【蜜蜂领域／黄蜂领域】the_bumblezone-7.15.2+1.21.1-neoforge.jar', 'resourcefullib-neoforge-1.21-3.0.12.jar'],
    permissions: ['open-parties-and-claims-neoforge-1.21.1-0.28.1.jar', 'ftb-ranks-neoforge-2101.1.3.jar',
                  'architectury-13.0.8-neoforge.jar', 'ftb-library-neoforge-2101.1.33.jar'],
    environment: ['【静谧四季／季节】SereneSeasons-neoforge-1.21.1-10.1.0.3.jar', 'GlitchCore-neoforge-1.21.1-2.1.0.2.jar',
                  '【自然罗盘／生物群系指南针】NaturesCompass-1.21.1-3.4.0-neoforge.jar', '【探险者指南针】ExplorersCompass-1.21.1-3.4.0-neoforge.jar',
                  '【传送石碑／指路石】waystones-neoforge-1.21.1-21.1.37.jar', 'balm-neoforge-1.21.1-21.0.63.jar']
]
ai4AdditionalProfiles.construction = (ai4AdditionalProfiles.permissions + ai4AdditionalProfiles.interaction + ai4AdditionalProfiles.slabs).unique()
ai4AdditionalProfiles.irons_backpacks = (ai4AdditionalProfiles.irons + ai4AdditionalProfiles.backpacks).unique()
ai4AdditionalProfiles.storage_dynamic = (ai4AdditionalProfiles.backpacks + [
        '【精妙存储】sophisticatedstorage-1.21.1-1.5.80.1999.jar',
        '【储物抽屉】StorageDrawers-neoforge-1.21.1-13.11.4.jar']).unique()
ai4AdditionalProfiles.building_dynamic = ['【夸克】Quark-4.1-482.jar', 'Zeta-1.1-40.jar',
        '【锦致装饰】supplementaries-neoforge-1.21.1-3.8.3.jar', 'moonlight-neoforge-1.21.1-3.1.2.jar',
        '【地图册】map_atlases-neoforge-1.21-6.6.0.jar', 'cloth-config-15.0.140-neoforge.jar']
ai4AdditionalProfiles.travel_permissions = (ai4AdditionalProfiles.environment + ai4AdditionalProfiles.permissions).unique()
ai4AdditionalProfiles.maid_tasks = (ai4AdditionalProfiles.maid + ai4AdditionalProfiles.irons + ai4AdditionalProfiles.permissions + [
        '【车万女仆：万法皆通】touhou_little_maid_spell-1.21.1-1.8.4-neoforge.jar',
        '【车万女仆：香草伙伴】touhou_little_maid_vanilla_companion-1.1.0.jar']).unique()
if (!(ai4TestModProfile in ['', 'chipped', 'fd', 'fd_mnd', 'cfb']) && !ai4AdditionalProfiles.containsKey(ai4TestModProfile)) {
    throw new GradleException('Unsupported isolated AI adapter test profile')
}
def ai4GameTestDirectory = ai4TestModProfile.isEmpty() ? 'gameTestServer' : "gameTestServer-${ai4TestModProfile}"

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // 独立客户端游戏目录：客户端专用 mod（IMBlocker 等）放 run-client/mods，避免被共享的 run/mods 带进 runServer 导致崩溃
            gameDirectory = project.file('run-client')

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.buildDirectory.dir(ai4GameTestDirectory).get().asFile
            if (!ai4TestModProfile.isEmpty()) jvmArgument '-Xmx1G'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO

            // Logs directory
            systemProperty 'neoforge.logs.directory', 'logs'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// 单测需要访问 MC/netty 类（如网络包 codec 测试）：并入主源集的完整编译 classpath
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Explicit opt-in validation mod and isolated game directories. Never included in the distributed JAR.
if (providers.gradleProperty('ai4Validation').orElse('false').get().toBoolean()) {
    sourceSets.create('validation') {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    def validationMod = neoForge.mods.create('fireflymc_validation') {
        sourceSet(sourceSets.validation)
    }
    def productionMod = neoForge.mods.getByName(project.mod_id)
    neoForge.runs.configureEach { loadedMods.set([productionMod]) }
    def scenario = providers.gradleProperty('ai4Scenario').orElse('dedicated-enabled').get()
    if (!(scenario in ['dedicated-enabled', 'dedicated-disabled', 'dedicated-missing', 'dedicated-construction', 'dedicated-equipment', 'dedicated-special', 'dedicated-advanced', 'dedicated-entities', 'dedicated-fluids', 'dedicated-environment', 'dedicated-permissions', 'dedicated-persistence', 'dedicated-shutdown', 'dedicated-fluid-storage', 'dedicated-fluid-processing', 'dedicated-processing-callbacks', 'dedicated-performance', 'dedicated-maid-tasks', 'dedicated-maid-transport', 'dedicated-maid-combat', 'dedicated-tree-harvest', 'dedicated-waystones-travel', 'dedicated-exploration', 'dedicated-storage-dynamic', 'dedicated-craftable'])) {
        throw new GradleException('Unknown isolated AI validation scenario')
    }
    neoForge.runs.create('ai4ValidationServer') {
        server()
        gameDirectory = layout.buildDirectory.dir("ai4-validation/game/${scenario}" + (ai4TestModProfile.isEmpty() ? '' : "-${ai4TestModProfile}"))
        sourceSet = sourceSets.validation
        loadedMods.set([productionMod, validationMod])
        programArgument '--nogui'
        jvmArgument '-Xmx1G'
        systemProperty 'fireflymc.validation.scenario', scenario
        systemProperty 'fireflymc.validation.profile', ai4TestModProfile
        systemProperty 'fireflymc.validation.restartPhase', providers.gradleProperty('ai4RestartPhase').orElse('').get()
        systemProperty 'fireflymc.validation.restartRun', providers.gradleProperty('ai4RestartRun').orElse('').get()
        systemProperty 'fireflymc.validation.constructionOwnershipOnly', providers.gradleProperty('ai4ConstructionOwnershipOnly').orElse('false').get()
        systemProperty 'fireflymc.validation.constructionClosureOnly', providers.gradleProperty('ai4ConstructionClosureOnly').orElse('false').get()
        systemProperty 'fireflymc.validation.explorationPreparedOnly', providers.gradleProperty('ai4ExplorationPreparedOnly').orElse('false').get()
        systemProperty 'fireflymc.validation.reports', layout.buildDirectory.dir('ai4-validation/reports').get().asFile.absolutePath
    }
}

dependencies {
    if (ai4TestModProfile == 'equipment') {
        def accessory = layout.buildDirectory.file('ai4-validation/integrations/storage/equipment/accessories-neoforge-1.1.0-beta.48+1.21.1.jar').get().asFile
        if (!accessory.isFile()) throw new GradleException('The inspected Aether nested Accessories JAR is required for the equipment validation profile')
        localRuntime files(accessory)
    }
    if (ai4AdditionalProfiles.containsKey(ai4TestModProfile)) {
        def installedMods = file(providers.gradleProperty('ai4ModsDir').orElse('D:/Game/MC/.minecraft/versions/FireflyMC/mods').get())
        for (def name : ai4AdditionalProfiles[ai4TestModProfile]) {
            def jar = new File(installedMods, name)
            if (!jar.isFile()) throw new GradleException("Required local adapter test JAR missing: ${name}")
            localRuntime files(jar)
        }
    }
    if (ai4TestModProfile == 'chipped') {
        def installedMods = file(providers.gradleProperty('ai4ModsDir').orElse('D:/Game/MC/.minecraft/versions/FireflyMC/mods').get())
        for (def name : ['chipped-neoforge-1.21.1-4.0.2.jar', 'resourcefullib-neoforge-1.21-3.0.12.jar']) {
            def jar = new File(installedMods, name)
            if (!jar.isFile()) throw new GradleException("Required local adapter test JAR missing: ${name}")
            localRuntime files(jar)
        }
    }
    if (ai4TestModProfile in ['fd', 'fd_mnd']) {
        def installedMods = file(providers.gradleProperty('ai4ModsDir').orElse('D:/Game/MC/.minecraft/versions/FireflyMC/mods').get())
        def jar = new File(installedMods, '【农夫乐事】FarmersDelight-1.21.1-1.3.2.jar')
        if (!jar.isFile()) throw new GradleException('Required Farmer\'s Delight 1.3.2 test JAR missing')
        localRuntime files(jar)
        if (ai4TestModProfile == 'fd_mnd') {
            def addon = new File(installedMods, 'MyNethersDelight-1.21.1-1.10.2.jar')
            if (!addon.isFile()) throw new GradleException('Required My Nethers Delight 1.10.2 test JAR missing')
            localRuntime files(addon)
        }
    }
    if (ai4TestModProfile == 'cfb') {
        def installedMods = file(providers.gradleProperty('ai4ModsDir').orElse('D:/Game/MC/.minecraft/versions/FireflyMC/mods').get())
        for (def name : ['【傻瓜烹饪／懒人厨房】cookingforblockheads-neoforge-1.21.1-21.1.24.jar', 'balm-neoforge-1.21.1-21.0.63.jar']) {
            def jar = new File(installedMods, name)
            if (!jar.isFile()) throw new GradleException("Required local CFB test JAR missing: ${name}")
            localRuntime files(jar)
        }
    }
    // Mixin for chat message interception
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // 点歌系统：JLayer MP3 解码器（LGPL，以嵌套 jar 分发，不 shade 不 relocate）
    jarJar(implementation('javazoom:jlayer:1.0.1')) {
        version {
            strictly '[1.0.1]'
            prefer '1.0.1'
        }
    }
    // ModDevGradle 开发环境需要额外将 jarJar 库放进运行时 classpath，否则 runClient 时 ClassNotFoundException
    additionalRuntimeClasspath 'javazoom:jlayer:1.0.1'
    jarJar(implementation("org.jsoup:jsoup:${jsoup_version}")) {
        version {
            strictly "[${jsoup_version},2.0)"
            prefer jsoup_version
        }
    }
    additionalRuntimeClasspath "org.jsoup:jsoup:${jsoup_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Explicit live verification only. Never reads existing game credentials or runs as part of build.
def ai4LiveConfiguration = providers.gradleProperty('ai4LiveConfig').orElse('')
def ai4VerificationReport = layout.buildDirectory.file('ai4-validation/provider-report.json')
def ai4LiveProtocol = providers.gradleProperty('ai4LiveProtocol').orElse('')
def ai4LiveStreaming = providers.gradleProperty('ai4LiveStreaming').orElse('false')
tasks.register('verifyAiProvider', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'firefly520.fireflymc.ai.LiveProviderVerification'
    args ai4LiveConfiguration.get(), ai4VerificationReport.get().asFile.absolutePath, ai4LiveProtocol.get(), ai4LiveStreaming.get()
    doFirst {
        if (getArgs().get(0).isBlank()) {
            throw new GradleException('Pass -Pai4LiveConfig=<new isolated credential file> explicitly')
        }
    }
}

// Explicit opt-in: real provider, production runtime and synthetic inventory only; never part of build/test.
tasks.register('verifyAiAnswerDelivery', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'firefly520.fireflymc.ai.LiveAnswerDeliveryVerification'
    args ai4LiveConfiguration.get(), ai4VerificationReport.get().asFile.absolutePath,
            layout.buildDirectory.file('ai4-validation/public/pricing-runtime-delivery-20261028.json').get().asFile.absolutePath
    doFirst {
        if (getArgs().get(0).isBlank()) throw new GradleException('Pass -Pai4LiveConfig=<new isolated credential file> explicitly')
    }
}

// Opt-in offline measurements; does not launch Minecraft or contact a model provider.
tasks.register('verifyAiPlannerPerformance', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'firefly520.fireflymc.ai.processing.PlannerPerformanceVerification'
    maxHeapSize = '512m'
    args layout.buildDirectory.file('ai4-validation/planner-performance.json').get().asFile.absolutePath
}

// Materialize tracked IDE GameTest SNBT sources into the isolated GameTest server working
// directory expected by StructureUtils.DEFAULT_TEST_STRUCTURES_DIR.
def prepareGameTestStructures = tasks.register('prepareGameTestStructures', Copy) {
    from(file('src/main/resources/data/fireflymc/structure')) {
        include '**/*.snbt'
    }
    into project.layout.buildDirectory.dir("${ai4GameTestDirectory}/gameteststructures")
}

tasks.named('runGameTestServer').configure {
    dependsOn prepareGameTestStructures
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Jar manifest configuration
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'fireflymc',
                'Specification-Vendor'    : 'FireflyMC',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : "${version}",
                'Implementation-Vendor'   : 'FireflyMC',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // LGPL 分发义务：第三方声明与 JLayer 许可证文本随 jar 一同分发（根目录 NOTICE.md + licenses/）
    from 'NOTICE.md'
    from('licenses') {
        into 'licenses'
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
